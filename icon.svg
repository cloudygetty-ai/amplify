<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a1060"/>
      <stop offset="100%" stop-color="#07050f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d8e8"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d8e8"/>
      <stop offset="25%" stop-color="#8890a8"/>
      <stop offset="50%" stop-color="#c8cce0"/>
      <stop offset="75%" stop-color="#5a5f78"/>
      <stop offset="100%" stop-color="#d4d8e8"/>
    </linearGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Steel bezel border -->
  <rect width="512" height="512" rx="112" fill="url(#steel)"/>

  <!-- Inner glass panel -->
  <rect x="8" y="8" width="496" height="496" rx="106" fill="url(#bg)"/>

  <!-- Top glass gloss -->
  <ellipse cx="256" cy="100" rx="200" ry="80" fill="rgba(255,255,255,0.07)"/>

  <!-- Nebula glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="80" cy="60" r="1.5" fill="#e6e6fa" opacity="0.8"/>
  <circle cx="140" cy="40" r="1" fill="#c084fc" opacity="0.7"/>
  <circle cx="380" cy="55" r="2" fill="#e6e6fa" opacity="0.9"/>
  <circle cx="440" cy="90" r="1" fill="#818cf8" opacity="0.6"/>
  <circle cx="60" cy="150" r="1.5" fill="#e6e6fa" opacity="0.5"/>
  <circle cx="460" cy="180" r="1" fill="#c084fc" opacity="0.7"/>
  <circle cx="420" cy="420" r="1.5" fill="#e6e6fa" opacity="0.6"/>
  <circle cx="90" cy="400" r="1" fill="#818cf8" opacity="0.5"/>
  <circle cx="200" cy="460" r="1" fill="#c084fc" opacity="0.4"/>

  <!-- Waveform bars -->
  <g opacity="0.6" transform="translate(256,280)">
    <rect x="-90" y="-5" width="14" height="10" rx="3" fill="#818cf8"/>
    <rect x="-70" y="-18" width="14" height="36" rx="3" fill="#9d79fb"/>
    <rect x="-50" y="-32" width="14" height="64" rx="3" fill="#b279f7"/>
    <rect x="-30" y="-20" width="14" height="40" rx="3" fill="#c084fc"/>
    <rect x="-10" y="-45" width="14" height="90" rx="3" fill="#c084fc"/>
    <rect x="10" y="-28" width="14" height="56" rx="3" fill="#c084fc"/>
    <rect x="30" y="-38" width="14" height="76" rx="3" fill="#b279f7"/>
    <rect x="50" y="-18" width="14" height="36" rx="3" fill="#9d79fb"/>
    <rect x="70" y="-8" width="14" height="16" rx="3" fill="#818cf8"/>
  </g>

  <!-- AMPLIFY text -->
  <text x="256" y="210"
    font-family="Arial Black, sans-serif"
    font-size="72" font-weight="900"
    text-anchor="middle"
    fill="url(#text-grad)"
    filter="url(#blur-glow)"
    letter-spacing="4">AMPLIFY</text>

  <!-- Subtitle -->
  <text x="256" y="380"
    font-family="monospace"
    font-size="22"
    text-anchor="middle"
    fill="#7c6d9e"
    letter-spacing="6">VOICE ISOLATION</text>

  <!-- Inner steel rim -->
  <rect x="8" y="8" width="496" height="496" rx="106"
    fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="14" y="14" width="484" height="484" rx="102"
    fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
</svg>